<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | Aurora Femme</title>
  <meta name="description" content="Hilos de encaje con tirantes graduables y panties invisibles sin costuras. Envíos a toda Colombia.">
  <meta name="theme-color" content="#FDF7F5">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Jost:wght@300;400;500&family=Prata&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=6">
</head>
<body data-pagina="tienda" class="tienda-pagina">
  <a class="sr-only" href="#contenido">Saltar al contenido</a>
  <div id="cabecera"></div>
  <main id="contenido">
    <div class="wrap">
      <header class="cabeza-pagina">
        <h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">Catálogo</h1>
        <p>Elige tus piezas, arma tu bolsa y envía tu pedido por WhatsApp. Confirmas el pago con nosotras: Nequi, Daviplata, transferencia o contraentrega.</p>
      </header>
    </div>
    <section class="catalogo" aria-label="Tienda">
      <!-- Tienda AURORA -->
      <iframe id="aurora-tienda" src="https://pedidos.laempanadaguerrera.com/t/AURORA?embed=1" title="Tienda" loading="lazy"
        style="width:100%;height:700px;border:0;display:block"
        sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms"></iframe>
    </section>
    <div class="wrap"><p class="catalogo-ayuda">¿No carga el catálogo? <a class="enlace" href="https://pedidos.laempanadaguerrera.com/t/AURORA" target="_blank" rel="noopener">Ábrelo en una pestaña nueva</a> o <a class="enlace" href="https://wa.me/573127527565" target="_blank" rel="noopener">escríbenos por WhatsApp</a>.</p></div>
  </main>
  <div id="pie"></div>
  <script src="assets/js/data.js?v=6"></script>
  <script src="assets/js/app.js?v=6"></script>
  <script>
  (function () {
    var f = document.getElementById('aurora-tienda');
    var ORIGEN = new URL(f.src, location.href).origin;
    var P = 'aurora:', KEY = 'aurora-tienda-estado', previo = null;
    function enviar(m) { f.contentWindow.postMessage(m, ORIGEN); }
    function abrir() { if (previo === null) previo = f.getAttribute('style') || ''; f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:2147483000;border:0;background:transparent'; document.documentElement.style.overflow = 'hidden'; }
    // Solo restaura si la bolsa se abrió antes (evita borrar el ancho del iframe al cargar)
    function cerrar() { if (previo === null) return; f.style.cssText = previo; previo = null; document.documentElement.style.overflow = ''; }
    window.addEventListener('message', function (e) {
      if (e.origin !== ORIGEN || e.source !== f.contentWindow) return;
      var m = e.data || {};
      if (typeof m.tipo !== 'string' || m.tipo.indexOf(P) !== 0) return;
      switch (m.tipo.slice(P.length)) {
        case 'altura': f.style.height = m.alto + 'px'; break;
        case 'bolsa-abierta': abrir(); break;
        case 'bolsa-cerrada': cerrar(); break;
        case 'subir': f.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
        case 'bolsa': if (window.auroraContador) window.auroraContador(m.unidades); break;
        case 'estado-guardar': try { localStorage.setItem(KEY, JSON.stringify({ bolsa: m.bolsa, cliente: m.cliente })); } catch (x) {} break;
        case 'estado-pedir': var s = null; try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (x) {} enviar({ tipo: P + 'estado', bolsa: s && s.bolsa, cliente: s && s.cliente }); break;
      }
    });
    // El ícono de bolsa de la cabecera abre la bolsa de la tienda
    window.auroraAbrirBolsa = function () { enviar({ tipo: P + 'abrir-bolsa' }); };
    // Llegando desde otra página con ?bolsa=1, abre la bolsa al cargar
    if (new URLSearchParams(location.search).get('bolsa') === '1') {
      f.loading = 'eager';
      f.addEventListener('load', function () { setTimeout(window.auroraAbrirBolsa, 600); });
    }
  })();
  </script>
</body>
</html>
