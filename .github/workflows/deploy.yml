name: Publicar sitio (GitHub Pages)

# Publica aurorafemme.co en cada push a main y una vez al día (6:15 a. m. en Bogotá)
# para traer las últimas publicaciones de Instagram y el catálogo actualizado
# (páginas de producto, sitemap.xml y el feed merchant.xml para Google Merchant Center).
# Token de Instagram: secreto IG_TOKEN (Settings → Secrets and variables → Actions).
# Sin token, la sección de Instagram muestra solo los botones de seguir.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'

permissions:
  contents: write   # para guardar la copia de respaldo del catálogo (data/catalogo.json)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Herramienta para comprimir fotos
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Últimas publicaciones de Instagram
        run: node scripts/instagram.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Catálogo para Google (fichas, sitemap y feed de Merchant)
        run: node scripts/catalogo.mjs
      - name: Guardar copia de respaldo del catálogo
        run: |
          if [ -n "$(git status --porcelain data/catalogo.json assets/img/logo-aurora-femme.png)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalogo.json assets/img/logo-aurora-femme.png
            git commit -m "Catálogo: copia de respaldo actualizada"
            git pull -q --rebase origin main && git push || echo "No se pudo guardar la copia (se intentará en el próximo deploy)."
          fi
      - name: Preparar archivos del sitio
        run: |
          mkdir -p _sitio
          rsync -a --exclude node_modules --exclude _sitio --exclude .git --exclude .github --exclude scripts --exclude data --exclude README.md --exclude .gitignore ./ _sitio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
