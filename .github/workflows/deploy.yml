name: Publicar sitio (GitHub Pages)

# Publica aurorafemme.co en cada push a main y una vez al día (6:15 a. m. en Bogotá)
# para traer las últimas publicaciones de Instagram.
# Token de Instagram: secreto IG_TOKEN (Settings → Secrets and variables → Actions).
# Sin token, la sección de Instagram muestra solo los botones de seguir.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Herramienta para comprimir fotos
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Últimas publicaciones de Instagram
        run: node scripts/instagram.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Preparar archivos del sitio
        run: |
          mkdir -p _sitio
          rsync -a --exclude node_modules --exclude _sitio --exclude .git --exclude .github --exclude scripts --exclude README.md ./ _sitio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
